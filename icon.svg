<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)" stroke="#38bdf8" stroke-width="3" />
  
  <!-- Taijitu (Yin Yang) Symbol -->
  <g transform="translate(64, 64) scale(0.72) translate(-64, -64)">
    <circle cx="64" cy="64" r="50" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 64 14 A 50 50 0 0 1 64 114 A 25 25 0 0 1 64 64 A 25 25 0 0 0 64 14" fill="#38bdf8"/>
    <circle cx="64" cy="39" r="7" fill="#0f172a"/>
    <circle cx="64" cy="89" r="7" fill="#38bdf8"/>
  </g>
</svg>
